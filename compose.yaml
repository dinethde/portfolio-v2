# Runs the production image on http://localhost:3000.
# GITHUB_TOKEN is read from your shell, never committed.
services:
  web:
    build:
      context: .
      args:
        SITE_URL: http://localhost:3000
      secrets:
        - GITHUB_TOKEN
    ports:
      - "3000:3000"
    environment:
      GITHUB_LOGIN: dinethde
      SITE_URL: http://localhost:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN

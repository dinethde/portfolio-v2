name: Refresh contributions fallback

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Fetch fresh contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: python3 scripts/refresh_fallback.py
      - name: Open a PR if the file changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content/contributions.fallback.json; then
            echo "No change."
            exit 0
          fi
          branch="chore/refresh-contributions-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/content/contributions.fallback.json
          git commit -m "chore(content): refresh the contributions fallback" \
            -m "Weekly refresh so the chart has recent data when the GitHub API is unreachable."
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore(content): refresh the contributions fallback" \
            --body "Weekly refresh of the chart's fallback data, so it stays recent when the GitHub API can't be reached."

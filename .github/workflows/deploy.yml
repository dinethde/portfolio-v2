name: Deploy

# Runs after CI passes on a push to main. Only a person merges into main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # SITE_URL comes from wrangler.jsonc and the Dockerfile's default (STATE D-68).
      - name: Deploy the Worker and container
        run: bunx wrangler deploy
      - name: Set the container's GitHub token
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN_VALUE" | bunx wrangler secret put GITHUB_TOKEN
